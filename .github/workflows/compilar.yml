name: Compilar súmula

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # permite rodar manualmente na aba Actions

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Compilar main.tex
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_xelatex: false

      - name: Guardar o PDF
        uses: actions/upload-artifact@v4
        with:
          name: sumula-pdf
          path: main.pdf
